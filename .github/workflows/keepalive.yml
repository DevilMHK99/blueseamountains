name: surge keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - name: check
        id: check
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0 (bluesea-keepalive)" --max-time 30 https://blueseamountains.surge.sh || echo 000)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "surge answered $code"
      - name: checkout
        if: steps.check.outputs.code != '200'
        uses: actions/checkout@v4
      - name: republish
        if: steps.check.outputs.code != '200'
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          mkdir -p /tmp/deploy && cp index.html /tmp/deploy/
          npx --yes surge /tmp/deploy blueseamountains.surge.sh --token "$SURGE_TOKEN"
          sleep 8
          code2=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0 (bluesea-keepalive)" --max-time 30 https://blueseamountains.surge.sh || echo 000)
          echo "after republish: $code2"
